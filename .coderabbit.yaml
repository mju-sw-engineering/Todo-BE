language: "ko-KR"

tone_instructions: "코드 리뷰는 친절하고 건설적인 톤으로 작성해주세요. 문제점을 지적할 때는 개선 방향도 함께 제시해주세요."

early_access: false

enable_free_tier: true

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  auto_title_placeholder: "@coderabbitai"
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  changed_files_summary: true

  path_filters:
    - "!build/**"
    - "!.gradle/**"
    - "!gradle/**"
    - "!**/*.class"
    - "!uploads/**"

  path_instructions:
    - path: "src/main/java/**/controller/**"
      instructions: |
        - REST API 설계 원칙(명사 기반 URL, 적절한 HTTP 메서드 사용)을 따르는지 확인하세요.
        - @Valid / @Validated 어노테이션으로 요청 DTO 검증이 이루어지는지 확인하세요.
        - ApiResponse 공통 응답 형식을 일관되게 사용하는지 확인하세요.
        - Swagger(@Operation, @ApiResponse 등) 문서화 어노테이션이 적절히 작성됐는지 확인하세요.

    - path: "src/main/java/**/service/**"
      instructions: |
        - 비즈니스 로직이 Service 레이어에 집중되어 있는지 확인하세요.
        - @Transactional 어노테이션이 적절히 사용됐는지 확인하세요(읽기 전용 쿼리에는 readOnly = true).
        - 예외 처리가 명확하게 이루어지는지 확인하세요.

    - path: "src/main/java/**/entity/**"
      instructions: |
        - JPA 연관관계 설정이 올바른지 확인하세요(단방향/양방향, fetch 전략).
        - 불필요한 Eager 로딩을 피하고 있는지 확인하세요.
        - equals/hashCode 재정의가 필요한 경우 올바르게 구현됐는지 확인하세요.

    - path: "src/main/java/**/dto/**"
      instructions: |
        - DTO와 Entity 간 직접 참조가 없는지 확인하세요.
        - 요청/응답 DTO에 적절한 Bean Validation 어노테이션이 적용됐는지 확인하세요.

    - path: "src/main/java/com/todo/global/config/SecurityConfig.java"
      instructions: |
        - 보안 설정이 올바른지 꼼꼼히 확인하세요.
        - CORS 설정이 프로덕션 환경에 적합한지 확인하세요.

    - path: "src/main/java/com/todo/global/jwt/**"
      instructions: |
        - JWT 생성·파싱·만료·서명 검증 로직에 취약점이 없는지 확인하세요.
        - 토큰 또는 인증 실패 원인이 응답이나 로그에 과도하게 노출되지 않는지 확인하세요.

    - path: "src/main/java/com/todo/global/websocket/WebSocketAuthChannelInterceptor.java"
      instructions: |
        - STOMP CONNECT 인증이 REST API의 JWT 검증 정책과 일관적인지 확인하세요.
        - 인증되지 않은 연결과 잘못된 Bearer 토큰이 확실히 거부되는지 확인하세요.

    - path: "src/test/**"
      instructions: |
        - 테스트가 의미 있는 케이스를 커버하는지 확인하세요.
        - 엣지 케이스(빈 값, null, 경계값)가 테스트됐는지 확인하세요.

  auto_review:
    enabled: false
    drafts: false
    base_branches:
      - "main"
      - "develop"

chat:
  auto_reply: true
