services:
  mysql:
    image: mysql:8.0
    container_name: todo-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todo
      MYSQL_USER: todo
      MYSQL_PASSWORD: todo1234
    ports:
      - "3306:3306"
    volumes:
      - todo-mysql-data:/var/lib/mysql

volumes:
  todo-mysql-data:
