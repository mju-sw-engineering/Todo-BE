plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.todo'
version = '0.0.1-SNAPSHOT'

// Spring Boot 3.4.5가 관리하는 Testcontainers 1.20.6과 1.21.3은
// Docker 29의 최소 API 1.44보다 낡은 1.32를 사용해 /info 호출이 실패한다.
// 1.21.x 호환 수정이 들어간 1.21.4를 dependency-management 프로퍼티로 고정한다.
ext['testcontainers.version'] = '1.21.4'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('software.amazon.awssdk:bom:2.29.52')
    implementation 'software.amazon.awssdk:s3'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'net.coobird:thumbnailator:0.4.20'
    // JDK ImageIO에는 WebP 리더가 없어 WebP 인증 사진의 썸네일 생성이 항상 실패한다.
    // Thumbnailator가 ImageIO를 쓰므로 리더만 추가하면 된다. 출력은 jpg라 writer는 불필요하다.
    runtimeOnly 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    runtimeOnly 'com.mysql:mysql-connector-j'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    // MySQL 태그는 Docker가 필요해 기본 빌드에서 제외한다. ./gradlew mysqlTest로 따로 실행한다.
    useJUnitPlatform {
        excludeTags 'mysql'
    }
    finalizedBy jacocoTestReport

    testLogging {
        exceptionFormat = 'full'
    }
}

/**
 * MySQL Testcontainers 기반 테스트.
 *
 * <p>H2 + ddl-auto로는 검증할 수 없는 것만 여기에 둔다 — Flyway 마이그레이션 실제 적용,
 * 생성 컬럼·복합 FK 같은 MySQL 전용 제약, 그리고 REPEATABLE READ 아래의 동시성.
 */
tasks.register('mysqlTest', Test) {
    description = 'MySQL Testcontainers 기반 테스트 (마이그레이션·동시성). Docker가 필요하다.'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'mysql'
    }

    testLogging {
        exceptionFormat = 'full'
    }
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('jacocoTestReport') {
    dependsOn test

    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn test

    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }

            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.74
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}
