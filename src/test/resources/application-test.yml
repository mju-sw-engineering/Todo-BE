spring:
  datasource:
    url: jdbc:h2:mem:todo-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 2525
    username: test@example.com
    password: test-password

jwt:
  secret: test-secret-key-for-jwt-signing-that-is-long-enough
  expiration: 86400000
  refresh-expiration: 1209600000

apple:
  team-id: TEST_TEAM_ID
  web-client-id: com.test.app.web
  ios-client-id: com.test.app
  key-id: TEST_KEY_ID
  private-key: MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgtest-private-key-placeholder-for-testing
  public-key-url: https://appleid.apple.com/auth/keys
  token-url: https://appleid.apple.com/auth/token
  revoke-url: https://appleid.apple.com/auth/revoke

minio:
  endpoint: http://localhost:9000
  access-key: test-access-key
  secret-key: test-secret-key
  region: us-east-1
  bucket: test-bucket

app:
  frontend-base-url: http://localhost:3000

todo:
  scheduling:
    enabled: false

swagger:
  auth:
    username: test-user
    password: test-password
