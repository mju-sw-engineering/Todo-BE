# application-test.yml 위에 얹어 쓴다 (@ActiveProfiles({"test", "mysqltest"})).
# datasource url/username/password는 Testcontainers의 @ServiceConnection이 주입한다.
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    # 스키마는 Flyway가 만든다. validate로 두어 엔티티와 마이그레이션의 drift를 여기서 잡는다.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
