# 알림 문구 정의.
#
# 키는 NotificationType의 이름과 1:1로 대응한다. 모든 타입에 항목이 있어야 하며,
# 빠지면 애플리케이션이 기동하지 않는다(NotificationMessageProperties의 검증).
#
# ── 자리표시자 두 종류 ──────────────────────────────────────────────
#
#   {actor}  — 알림을 유발한 사람. 저장 시점에는 그대로 두고 조회 시점에
#              현재 닉네임으로 치환한다. 닉네임을 바꾸거나 탈퇴해도 항상 최신
#              값으로 보이며, 탈퇴자는 '탈퇴한 사용자'가 된다.
#              문구를 저장하는 알림(send/sendAll)에서만 쓴다.
#
#   그 외     — 발송 시점에 채워지는 값. 여기 쓰는 이름은 NotificationMessageFactory의
#              팩토리 메서드가 넘기는 키와 같아야 한다.
#
# ── 문구를 추가·수정할 때 ────────────────────────────────────────────
#
#   문구만 고치는 것: 이 파일만 수정하면 된다. 코드 변경 없음.
#   새 알림 종류 추가: NotificationType에 상수 추가 → 여기에 항목 추가 →
#                     NotificationMessageFactory에 팩토리 메서드 추가.
#                     (종류는 DB에 문자열로 저장되고 FE가 분기하므로 enum이 필요하다)

notification:
  messages:

    # ── 투두 ────────────────────────────────────────────────────────
    TODO_CREATED:
      title: "새로운 투두가 생성되었습니다."
      content: "{actor}님이 '{todoTitle}'을(를) 만들었습니다."

    TODO_ASSIGNED:
      title: "새로운 할 일이 배정되었습니다."
      content: "{actor}님이 '{todoTitle}'의 할 일 {taskCount}개를 배정했습니다."

    TODO_UNASSIGNED:
      title: "할 일이 미배정 상태가 되었습니다."
      content: "{actor}님이 '{todoTitle}'의 할 일 {taskCount}개를 미배정으로 변경했습니다."

    TODO_SUBMITTED:
      title: "인증 사진이 제출되었습니다."
      content: "{actor}님이 '{todoTitle}'의 인증 사진을 제출했습니다."

    # 제출자 본인에게만 발송한다. 팀에는 어떤 신호도 가지 않는다.
    # 무임승차를 막는 게 목적이지 팀 앞에서 지적하는 게 목적이 아니므로 안내조로 쓴다.
    AI_PROOF_MISMATCH:
      title: "제출한 인증 파일을 확인해 주세요."
      content: "'{todoTitle}'에 올린 인증 파일이 할 일과 달라 보여요. 다시 확인해 주세요."

    TODO_DEADLINE_APPROACHING:
      title: "마감이 30분 앞으로 다가왔습니다."
      content: "'{todoTitle}'의 마감이 30분 남았습니다."

    TODO_WORK_ITEM_EXPIRED:
      title: "마감을 넘겨 실패 처리되었습니다."
      content: "'{todoTitle}'이(가) 마감을 넘겨 실패 처리되었습니다."

    TODO_REACTION_ADDED:
      title: "제출물에 반응이 남았습니다."
      content: "{actor}님이 '{todoTitle}' 제출물에 반응을 남겼습니다."

    TODO_ALL_COMPLETED:
      title: "모든 할 일이 완료되었습니다."
      content: "'{todoTitle}'의 모든 할 일이 성공적으로 완료되었습니다."

    # ── 팀 ──────────────────────────────────────────────────────────
    TEAM_MEMBER_JOINED:
      title: "새 팀원이 합류했습니다."
      content: "{actor}님이 팀에 합류했습니다."

    TEAM_MEMBER_LEFT:
      title: "팀원이 나갔습니다."
      content: "{actor}님이 팀을 나갔습니다."

    TEAM_MEMBER_REMOVED:
      title: "팀에서 나가게 되었습니다."
      content: "{actor}님에 의해 팀에서 나가게 되었습니다."

    TEAM_LEADER_CHANGED:
      title: "팀장 권한을 이어받았습니다."
      content: "기존 팀장의 탈퇴로 팀장 권한을 이어받았습니다."

    # ── 보안 ────────────────────────────────────────────────────────
    NEW_DEVICE_LOGIN:
      title: "새로운 기기에서 로그인되었습니다."
      content: "본인이 아니라면 비밀번호를 변경하고 다른 기기를 로그아웃해주세요."

    PASSWORD_CHANGED:
      title: "비밀번호가 변경되었습니다."
      content: "본인이 변경하지 않았다면 즉시 계정 상태를 확인해주세요."

    # ── 회의시간 투표 ───────────────────────────────────────────────
    AVAILABILITY_POLL_CREATED:
      title: "새로운 회의시간 투표가 생성되었습니다."
      content: "{actor}님이 '{pollTitle}' 투표를 시작했습니다."

    # ── 채팅 ────────────────────────────────────────────────────────
    # push 전용이라 저장되지 않는다. 발송 시점의 이름이 곧 현재 이름이므로
    # {actor}가 아니라 발신자 닉네임을 그대로 채운다.
    CHAT_MESSAGE:
      title: "{senderNickname}님이 메시지를 보냈습니다."
      content: "{content}"
