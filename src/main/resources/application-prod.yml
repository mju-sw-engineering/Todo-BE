spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  region: ${MINIO_REGION}
  bucket:
    profiles: ${MINIO_BUCKET_PROFILES}
    teams: ${MINIO_BUCKET_TEAMS}

app:
  api-server-url: ${API_SERVER_URL:https://api.swe.bluerack.org}
