spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET}

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  region: ${MINIO_REGION}
  bucket: ${MINIO_BUCKET:uploads}
  presigned-url-expiration: ${MINIO_PRESIGNED_URL_EXPIRATION:3600}
  put-presigned-url-expiration: ${MINIO_PUT_PRESIGNED_URL_EXPIRATION:600}

app:
  api-server-url: ${API_SERVER_URL:https://api.swe.bluerack.org}
  frontend-base-url: ${FRONTEND_BASE_URL}
  team-invite-path: ${TEAM_INVITE_PATH:/teams/join}

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:https://ai.swe.bluerack.org}
