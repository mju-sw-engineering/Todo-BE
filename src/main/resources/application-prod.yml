spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${MAIL_SMTP_READ_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT_MS:10000}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

jwt:
  secret: ${JWT_SECRET}

# 운영은 HTTPS 전용이므로 환경변수로도 내릴 수 없게 고정한다.
# 이 값이 false가 되면 2주짜리 리프레시 토큰이 평문으로 전송된다.
cookie:
  secure: true

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  region: ${MINIO_REGION}
  bucket: ${MINIO_BUCKET:uploads}
  presigned-url-expiration: ${MINIO_PRESIGNED_URL_EXPIRATION:3600}
  put-presigned-url-expiration: ${MINIO_PUT_PRESIGNED_URL_EXPIRATION:600}
  api-call-timeout: ${MINIO_API_CALL_TIMEOUT:30s}
  api-call-attempt-timeout: ${MINIO_API_CALL_ATTEMPT_TIMEOUT:10s}

app:
  api-server-url: ${API_SERVER_URL:https://api.todo.bluerack.org}
  frontend-base-url: ${FRONTEND_BASE_URL}
  team-invite-path: ${TEAM_INVITE_PATH:/teams/join}

websocket:
  stats:
    logging:
      enabled: true
      interval-ms: 600000
      initial-delay-ms: 60000

logging:
  level:
    org.springframework.web.socket.config.WebSocketMessageBrokerStats: WARN
