spring:
  profiles:
    default: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,diskSpace

jwt:
  expiration: 86400000

ai:
  server:
    base-url: https://ai.swe.bluerack.org
    connect-timeout: 3s
    read-timeout: 15s

mail:
  async:
    core-pool-size: ${MAIL_ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${MAIL_ASYNC_MAX_POOL_SIZE:4}
    queue-capacity: ${MAIL_ASYNC_QUEUE_CAPACITY:100}
    await-termination-seconds: ${MAIL_ASYNC_AWAIT_TERMINATION_SECONDS:15}
