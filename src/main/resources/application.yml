spring:
  profiles:
    default: local
  # 알림 문구는 코드가 아니라 이 파일에서 관리한다. 문구 수정에 재컴파일이 필요 없다.
  config:
    import: classpath:notification-messages.yml
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
  task:
    scheduling:
      pool:
        # 기본값 1이면 스케줄 작업이 스레드 하나를 공유해 서로를 지연시킨다.
        # 현재 등록된 작업 수(투두 만료, 메일/파일 outbox, 채팅 정리, 인증 파일 판정)에 맞춘다.
        size: 6

swagger:
  auth:
    username: ${SWAGGER_USERNAME}
    password: ${SWAGGER_PASSWORD}

server:
  port: 8080
  shutdown: graceful

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:3001
    - https://todo.bluerack.org

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,diskSpace

jwt:
  expiration: 3600000
  refresh-expiration: 1209600000

cookie:
  # 리프레시 토큰 쿠키의 Secure 속성. 기본값은 항상 안전한 쪽(true)이며,
  # HTTPS가 아닌 로컬 HTTP 환경에서만 application-local.yml이나 COOKIE_SECURE로 false로 내린다.
  # 운영은 application-prod.yml에서 true로 고정돼 이 값의 영향을 받지 않는다.
  secure: ${COOKIE_SECURE:true}

openai:
  # 키는 커밋하지 않는다. 로컬은 application-local.yml, 배포는 환경변수로 주입한다.
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  model: ${OPENAI_MODEL:gpt-5.6-luna}
  # 비용의 지배 변수. none|low|medium|high|xhigh|max 중 low를 기본으로 둔다.
  # 판정·요약에는 추론이 거의 필요 없는데, 기본값 medium이면 reasoning 토큰이
  # 입력 단가의 6배인 출력 단가로 붙어 본문 입력비를 역전한다.
  reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
  max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:400}
  connect-timeout: 3s
  # 모델 추론 시간을 감안해 다른 외부 호출보다 길게 둔다. 호출부가 폴러라
  # 타임아웃이 없으면 스레드가 물려 분석 큐 전체가 밀린다.
  read-timeout: 30s

holiday:
  api:
    # 공공데이터포털 한국천문연구원 특일정보(getRestDeInfo). 키는 커밋하지 않는다 — 로컬은
    # application-local.yml, 배포는 환경변수. 키가 없으면 공휴일 없이 추천이 동작한다.
    # 포털이 주는 두 키 중 "Decoding" 키를 넣는다. Encoding 키는 URI 빌더가 한 번 더 인코딩해
    # SERVICE_KEY_IS_NOT_REGISTERED(returnReasonCode 30)로 거절된다. 키 활성화 전에도 같은 오류가 난다.
    service-key: ${HOLIDAY_API_SERVICE_KEY:}
    base-url: ${HOLIDAY_API_BASE_URL:https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService}
    connect-timeout: 3s
    read-timeout: 5s

proof-analysis:
  # 스케줄러 전체가 아니라 AI 폴러만 끄는 스위치. OpenAI 장애가 길어지면 false로 내리고,
  # 복구 후 다시 켜면 큐에 쌓인 건이 그대로 처리된다.
  enabled: ${PROOF_ANALYSIS_ENABLED:true}
  poll-interval-ms: ${PROOF_ANALYSIS_POLL_INTERVAL_MS:10000}
  batch-size: ${PROOF_ANALYSIS_BATCH_SIZE:20}

chat:
  cleanup:
    # 보관 기간 정책은 팀 논의에 따라 재배포 없이 조정할 수 있도록 설정값으로 둔다.
    cron: ${CHAT_CLEANUP_CRON:0 0 3 * * *}
    retention-days: ${CHAT_CLEANUP_RETENTION_DAYS:7}

mail:
  async:
    core-pool-size: ${MAIL_ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${MAIL_ASYNC_MAX_POOL_SIZE:4}
    queue-capacity: ${MAIL_ASYNC_QUEUE_CAPACITY:100}
    await-termination-seconds: ${MAIL_ASYNC_AWAIT_TERMINATION_SECONDS:15}

apple:
  team-id: ${APPLE_TEAM_ID}
  web-client-id: ${APPLE_WEB_CLIENT_ID}
  ios-client-id: ${APPLE_IOS_CLIENT_ID}
  key-id: ${APPLE_KEY_ID}
  private-key: ${APPLE_PRIVATE_KEY}
  public-key-url: https://appleid.apple.com/auth/keys
  token-url: https://appleid.apple.com/auth/token
  revoke-url: https://appleid.apple.com/auth/revoke

file-deletion:
  async:
    core-pool-size: ${FILE_DELETION_ASYNC_CORE_POOL_SIZE:1}
    max-pool-size: ${FILE_DELETION_ASYNC_MAX_POOL_SIZE:2}
    queue-capacity: ${FILE_DELETION_ASYNC_QUEUE_CAPACITY:100}
    await-termination-seconds: ${FILE_DELETION_ASYNC_AWAIT_TERMINATION_SECONDS:15}
